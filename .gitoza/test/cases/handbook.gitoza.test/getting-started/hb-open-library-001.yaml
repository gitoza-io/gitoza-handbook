# Open Library welcome page

## Steps

1. Open **Library** in the sidebar.
2. Expand folder **02-getting-started**.
3. Open page **Welcome to the Gitoza Handbook** (`W-HBK001`).
4. Confirm title and first sections render in read mode.

## Expected Result

The welcome page opens with readable Markdown and working wiki/ticket links.

