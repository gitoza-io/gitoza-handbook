# Sync drafting awareness

## Steps

1. Read [[GITO-SYNC01|Practice the Sync workflow]] and [[wiki:W-HBK040|Sync and Confirm Changes]].
2. On a **fork** of this handbook (upstream is read-only), edit a ticket title slightly.
3. Confirm the UI shows **Drafting**.
4. Run **Sync** → **Confirm Changes** → **Process** (or cancel if you only want to observe the diff).

## Expected Result

Editors understand Drafting vs Sync vs Refresh before changing production repos.

