# Add cases using Filter cases search

## Steps

1. Open **Add cases** for your test run.
2. Click **Filter cases** in the folder tree toolbar.
3. Search for `sync` (by ID, title, tag, or path).
4. Confirm **Sync drafting awareness** appears in the results.
5. Select the case, preview it in the Detail panel, and include it in your selection.
6. Click **Done (N)**.

## Expected Result

The Add cases picker uses the same search UI as **Test Repository**. You can combine folder bulk-select with targeted search in one flow.

