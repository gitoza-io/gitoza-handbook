# Checkout smoke test

## Steps

1. Add an item to the cart.
2. Proceed to checkout.
3. Complete payment with test card.

## Expected Result

Order confirmation page is displayed.

## Linking demo

This case links to [[GITO-LINK01]]. After you create a test run that includes this case and sets **Covers** to `GITO-LINK01`, the ticket will show both **Tested by** and **Covered by runs**.
