# Export story smoke path

## Steps

1. Open **Test Repository** → project **handbook.gitoza.test**.
2. Select a few cases (including this one).
3. Use the product export flow for cases (CSV/PDF as available in your Gitoza version).
4. Confirm export references the planning work in [[GITO-STOR01]] / [[GITO-HIGH01]].

## Expected Result

Export completes without error; stakeholders can open the file. Failures are filed against the linked stories.

