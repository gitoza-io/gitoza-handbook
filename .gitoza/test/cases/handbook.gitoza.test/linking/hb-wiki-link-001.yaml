# Navigate wiki link from a ticket

## Steps

1. Open ticket [[GITO-WIKI01|Wiki links from tickets]].
2. In read mode, click a `[[wiki:…]]` link (for example Welcome or Linking syntax).
3. Confirm **Library** opens on the target page id.

## Expected Result

Wiki links from ticket bodies resolve to the correct Library page.

