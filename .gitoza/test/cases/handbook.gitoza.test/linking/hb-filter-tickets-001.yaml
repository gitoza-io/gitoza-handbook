# Filter tickets by tag and status

## Steps

1. Open **Tickets** → project **Gitoza_handbook**.
2. Open search and add **Tag** = `filters`.
3. Confirm [[GITO-SRCH01]] and [[GITO-TAGS01]] appear.
4. Clear chips; filter **Status** = `done` and confirm [[GITO-DONE01]].
5. Filter **Status** = `cancelled` and confirm [[GITO-DONE02]].

## Expected Result

Search chips narrow the ticket list correctly using the local index.

