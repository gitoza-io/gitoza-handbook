# Resolve conflict with Keep mine

## Steps

1. On a **fork**, arrange overlapping edits so rebase (or merge) will conflict on a file (local change vs remote/shared change to the same content).
2. Click **Sync** → **Confirm Changes** and let the pipeline reach conflict resolution.
3. For the conflicted file or hunk, choose **Keep mine** (local / ours).
4. Complete remaining conflicts if any and continue.

## Expected Result

Conflict UI appears instead of failing silently. **Keep mine** keeps the local version; after resolution, sync continues and rebase can complete ([[GITO-SYNC02]] AC-9–AC-11).

