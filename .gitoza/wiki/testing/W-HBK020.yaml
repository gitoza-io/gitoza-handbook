# Test Repository

The **Test Repository** is where you manage **test cases** — organized by project and suite folders.

## Open the handbook cases

1. Click **Test Repository** in the sidebar.
2. Open project **handbook.gitoza.test**.
3. Select **Explore the handbook in Gitoza** (`hb-welcome-001`) under the **getting-started** suite.

## What you can do

- **Edit / View** — switch modes in the case detail panel.
- **Tags and priority** — organize and filter cases.
- **Search** — use the search panel for tags, assignee, and more.
- **Link tickets** — add ticket ids under **Requirement IDs** (shows as **Tested by** on the ticket).

## Example cases

| Case id | Title |
|---------|-------|
| `hb-welcome-001` | Explore the handbook in Gitoza |
| `hb-verify-login` | Verify login error message (links to [[GITO-BUG001]]) |
| `hb-checkout-smoke` | Checkout smoke test (links to [[GITO-LINK01]]) |

