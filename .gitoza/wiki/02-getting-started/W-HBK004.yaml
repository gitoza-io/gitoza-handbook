# App layout and navigation

Gitoza’s sidebar groups work into **Planning** and **Testing**. Use this page as a map of where each handbook topic lives in the UI.

## Planning

| View | What you do |
|------|-------------|
| **Tickets** | Browse and edit ticket YAML under `.gitoza/tasks/tickets/` |
| **Releases** | Project-scoped release files and linked tickets |
| **Library** | Nested wiki folders and pages under `.gitoza/wiki/` |

## Testing

| View | What you do |
|------|-------------|
| **Dashboard** | Offline metrics from the local SQLite index |
| **Test Repository** | Projects, suites, and case files |
| **Test Run** | Execute cases and record pass / fail / skip |
| **Test Automation** | CI results when Storage Sync or automation uploads are configured |

## Try it

1. Click each Planning view once and note the two-column layout (tree + detail).
2. Open **Library** → folder **01-overview** → [[wiki:W-HBK000|Gitoza at a glance]].
3. Open **Tickets** → project **Gitoza_handbook**.

More detail: [gitoza.com/help](https://gitoza.com/help) → Workspace Guide.

