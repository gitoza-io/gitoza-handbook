# Test Runs

A **test run** is a session where you execute selected cases and record **Passed**, **Failed**, or **Skipped** for each one.

## Create a run for this handbook

This upstream handbook ships cases without a committed sample run so you can practice creating one:

1. Click **Test Run** in the sidebar.
2. Follow suite **test-run** in **Test Repository** — cases cover create run, bulk-add with preview, Filter cases search, Pass/Fail badges, and Sync.
3. Or freestyle: create a run (for example **Handbook smoke**), add cases from **auth** and **checkout**, mark results, set **Covers** to [[GITO-LINK01]].
4. Use **Sync** when you are ready to share with the team (on a fork).

## Why runs matter

Runs turn case definitions into execution evidence. Tickets show **Covered by runs** when a run lists their ids under **Covers**.

See [[GITO-LINK01|Tested by and Covered by runs]] and [[wiki:W-HBK022|Linking tickets and test cases]].

