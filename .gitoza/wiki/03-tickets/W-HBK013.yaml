# Search and filter tickets

Tickets search uses the local index: filter by title text, tags, status, priority, assignee, and more. Filters appear as chips and can replace the project tree until you close search.

## Try it with this handbook

1. Open **Tickets** → project **Gitoza_handbook**.
2. Open search from the tree toolbar.
3. Add a **Tag** filter for `filters` — you should see [[GITO-TAGS01]] and [[GITO-SRCH01]].
4. Clear tags, then filter **status** = `done` — expect [[GITO-DONE01]].
5. Filter **status** = `cancelled` — expect [[GITO-DONE02]].
6. Filter **priority** = `high` and scan bugs/stories such as [[GITO-BUG001]] and [[GITO-HIGH01]].

## Tips

- Combine a free-text query with chips for precise lists.
- Status quick filters in the toolbar are shortcuts for the same indexed field.
- Tags work best when the team keeps short, consistent names (`auth`, `regression`, `sync`).

