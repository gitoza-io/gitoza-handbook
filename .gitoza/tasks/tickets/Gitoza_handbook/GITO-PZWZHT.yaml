# Welcome — start here

This ticket is the **table of contents** for the Gitoza Handbook project. Use it as a map while you explore the app.

## What this handbook covers

- **Library** (wiki) — guided pages under `.gitoza/wiki/`
- **Tickets** — examples of types, tags, parents, and linking
- **Test Repository** — sample cases in project `handbook.gitoza.test`
- **Test Run** — one completed smoke run with mixed results

## Suggested reading order

```mermaid
flowchart TD
  start[Start here]
  lib[Library getting-started]
  types[Ticket type examples]
  features[Feature tickets tags parent linking]
