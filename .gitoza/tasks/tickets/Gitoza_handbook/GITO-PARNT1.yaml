# Parent tickets and child work

## Parent field

A ticket can list another ticket id as its **parent**. Gitoza shows **Children** on the parent ticket detail — a reverse lookup, no extra file edits on the parent.

## This ticket

This ticket is a child of [[GITO-PZWZHT|Welcome — start here]].

## Child example

Open [[GITO-CHLD01|Child ticket example]] — its parent is **this** ticket (`GITO-PARNT1`). On this ticket detail you should see it under **Children**.

