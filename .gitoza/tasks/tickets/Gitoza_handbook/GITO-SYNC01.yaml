# Practice the Sync workflow

When you edit YAML in Gitoza against a remote repo, the title bar shows **Drafting** until you sync.

## Steps (fork recommended)

1. Fork this handbook on GitHub and connect Gitoza to **your** fork (upstream is read-only).
2. Edit any ticket or wiki page and wait for autosave.
3. Click **Sync**, review diffs in **Confirm Changes**, then **Process**.
4. Confirm the remote `gitoza` branch received the commit.

## Refresh

After teammates push, or after IDE edits, use **Refresh** — see [[wiki:W-HBK041|Refresh and reindex]].

