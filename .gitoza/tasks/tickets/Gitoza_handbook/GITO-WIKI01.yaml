# Wiki links from tickets

Ticket and wiki bodies share the same link syntax. Use the toolbar **Insert link** control to search and insert.

## Examples in this ticket

- Wiki welcome: [[wiki:W-HBK001|Welcome to the Gitoza Handbook]]
- Linking syntax guide: [[wiki:W-HBK031|Linking syntax]]
- Product map: [[wiki:W-HBK000|Gitoza at a glance]]

## Try it

1. Switch this ticket to **Edit**.
2. Click **Insert link**, search for `Mermaid`, and insert [[wiki:W-HBK030]].
3. In read mode, click the link — **Library** should open that page.

