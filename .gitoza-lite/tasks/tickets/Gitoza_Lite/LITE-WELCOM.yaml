# Welcome — start here

This ticket is the **table of contents** for the Gitoza Lite in-repo handbook. Use it while you explore the extension UI.

## What you get in this clone

- **Extension source** — build and contribute to Gitoza Lite
- **Wiki** — numbered folders under `.gitoza-lite/wiki/` (`01-overview` … `05-authoring`)
- **Tickets** — types, statuses, tags, releases, AI workflow samples
- **Test Repository** — project `gitoza.lite.handbook`
- **Test Run** — `R-SMOKE1`

