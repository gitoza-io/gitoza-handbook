# Fix empty release filter

Sample **bug** ticket linked to release **0.1.1**. Not a real product defect — use it to practice release filters and release boards.

## Steps to reproduce

1. Open **Tickets** → project **Gitoza_Lite**.
2. Filter by release `0.1.1` (or `Gitoza_Lite/0-1-1`).
3. Observe the list when few or no tickets are linked.

## Expected

The release filter shows linked tickets (including this one) and stays consistent after Save.

## Actual (example)

Imagine the filter returns an empty list even though tickets are linked to the release — use this ticket to practice editing bug metadata and release links.
