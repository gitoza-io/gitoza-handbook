```

## Why files as truth

| Idea | What it means |
|------|----------------|
| **Local-first** | Everything is on disk under `.gitoza-lite/` — no cloud required |
| **Git-friendly** | Diff, review, and merge entities like any other source file |
| **AI-friendly** | Assistants can draft or edit YAML; you refine in the UI and commit |

## Modules

| Module | Path | Purpose |
|--------|------|---------|
| **Tickets** | `.gitoza-lite/tasks/tickets/` | Track bugs, stories, tasks, spikes |
| **Releases** | `…/{project}/releases/` | Group work for a version |
| **Wiki** | `.gitoza-lite/wiki/` | Docs as nested folders + pages |
| **Test Repository** | `.gitoza-lite/test/cases/` | Manual / automated case library |
| **Test Run** | `.gitoza-lite/test/run/` | Pass / Fail / Skip execution |

