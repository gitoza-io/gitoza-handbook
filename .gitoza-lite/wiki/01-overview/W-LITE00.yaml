# Gitoza Lite at a glance

Gitoza Lite is a **VS Code extension** for managing tickets, wiki pages, releases, and test cases as plain YAML + Markdown in your workspace.

This repository is both the **extension source** and a **living handbook**. Open the folder in VS Code with Gitoza Lite installed (or press **F5** from a development checkout) to explore the seeded content under `.gitoza-lite/`.

## Product map

```mermaid
flowchart LR
  subgraph ide [VS Code]
    Tickets
    Releases
    Wiki
    TestRepo[Test Repository]
